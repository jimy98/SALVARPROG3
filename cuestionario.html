            });

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${index}`;

            questionDiv.appendChild(optionsList);
            questionDiv.appendChild(feedback);
            container.appendChild(questionDiv);
        });

        // Evaluar respuestas
        function checkAnswers() {
            let score = 0;

            questions.forEach((q, index) => {
                const radios = document.getElementsByName(`question-${index}`);
                const feedbackDiv = document.getElementById(`feedback-${index}`);
                const card = document.getElementById(`q-card-${index}`);
                let selectedValue = -1;

                // Remover estilos previos
                const labels = card.querySelectorAll('label');
                labels.forEach(l => {
                    l.classList.remove('correct-answer');
                    l.classList.remove('incorrect-answer');
                });

                for (const radio of radios) {
                    if (radio.checked) {
                        selectedValue = parseInt(radio.value);
                        break;
                    }
                }

                if (selectedValue === q.ans) {
                    score++;
                    feedbackDiv.innerHTML = "✅ ¡Correcto!";
                    feedbackDiv.style.color = "#27ae60";
                    labels[selectedValue].classList.add('correct-answer');
                } else {
                    feedbackDiv.innerHTML = `❌ Incorrecto. La respuesta correcta era: <strong>${q.options[q.ans]}</strong>`;
                    feedbackDiv.style.color = "#c0392b";
                    if (selectedValue !== -1) {
                        labels[selectedValue].classList.add('incorrect-answer');
                    }
                    labels[q.ans].classList.add('correct-answer');
                }
            });

            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `Puntuación: ${score} de ${questions.length} ( ${(score/questions.length * 100).toFixed(2)}% )`;
            
            // Scroll a los resultados
            window.scrollTo({
                top: resultsDiv.offsetTop - 50,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
